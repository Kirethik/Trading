server {
    listen 80 default_server;
    server_name _;

    # FastAPI backend — existing dashboard routes + new /api/v1/*
    location /api/ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location /login  { proxy_pass http://127.0.0.1:8000; proxy_set_header Host $host; }
    location /logout { proxy_pass http://127.0.0.1:8000; proxy_set_header Host $host; }
    location /health { proxy_pass http://127.0.0.1:8000; }

    location /static/ {
        proxy_pass http://127.0.0.1:8000;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # Next.js frontend — catch-all (must be last)
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_cache_bypass $http_upgrade;
    }
}
